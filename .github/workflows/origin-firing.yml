# ai-flow: the origin-firing check as a reusable PR-status workflow
# (docs/paper.md §6.2/§15.6). On a learning repo's pull requests, one agent
# pass replays the proposal's origin thread against the PR's own index and the
# job fails when a changed learning's cue does not fire on the very context
# that produced it. Structure-only diffs and PRs without a `learned-from:`
# marker (migrations, manual edits) skip green.
#
# Adopting repos (the org knowledge repo first) reference this via a small
# caller workflow — see templates/proposal-checks.yml — at `@v1`, and pin
# the checker in their own `dependencies.rb` like every ai-flow adopter.
# The job is the same thin shell as ai-commands.yml: check out the adopter
# → `dev up` → `dev runner status --check` → `ai-flow gate`.
name: origin-firing

on:
  workflow_call:
    secrets:
      CURSOR_API_KEY:
        description: Authenticates the headless Cursor agent CLI on the runner.
        required: true
      AI_FLOW_APP_ID:
        description: >-
          GitHub App ID for the ai-flow App — needed to read origin threads
          in other private repos of the org. Without it the job's github.token
          covers same-repo and public origins only.
        required: false
      AI_FLOW_APP_PRIVATE_KEY:
        description: Private key for the ai-flow GitHub App.
        required: false

jobs:
  origin-firing:
    # The retrieval re-run is a /learn-class agent pass, so it rides the
    # same runner pool.
    runs-on: [self-hosted, ai-learn]
    # A new push to the PR supersedes the in-flight verdict.
    concurrency:
      group: origin-firing-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 30
    env:
      AI_FLOW_APP_ID: ${{ secrets.AI_FLOW_APP_ID }}
    steps:
      # Scoped to the proposal repo (plans#25): this token only serves the
      # checkout below and the no-App fallback. Cross-repo origin reads
      # happen in the checker, which holds the App key and mints its own
      # reach per call (TokenProvider); the agent pass inside it gets a
      # read-only token (installation-wide reads, zero writes).
      - name: Mint the ai-flow App token
        id: app-token
        if: ${{ env.AI_FLOW_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AI_FLOW_APP_ID }}
          private-key: ${{ secrets.AI_FLOW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      # Full history: the check diffs against origin/<base> to name the
      # changed learnings. persist-credentials off for the same reason as
      # ai-commands.yml — the agent subprocess must never find a baked token.
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
          persist-credentials: false

      # Same provisioning as ai-commands.yml: the adopter's lock pins the
      # checker (`gh "d3mlabs/ai-flow", "^1"`), and the job's `dev up`
      # installs it self-contained with its bin/ on the project PATH, as
      # the runner user, through its own gh login.
      - name: Install the adopter's lock
        uses: d3mlabs/dev/up@main

      # Inside ai-flow's own checkout, ai-flow is the checkout — the same
      # rule as ai-commands.yml: the checkout's exe/ resolves `ai-flow`.
      - name: Resolve ai-flow to the checkout when the checkout is ai-flow
        run: |
          if [ -x exe/ai-flow ] && [ -f lib/ai_flow.rb ] && grep -qx 'name: ai-flow' dev.yml 2>/dev/null; then
            echo "$GITHUB_WORKSPACE/exe" >> "$GITHUB_PATH"
          fi

      # Inspect, never converge (same reasoning as ai-commands.yml): the
      # ledger lands in the job log; drift does not fail the check, and the
      # checker has no reply surface, so the log is where it is read.
      - name: Check host posture
        continue-on-error: true
        run: dev runner status --check

      - name: Log versions
        run: |
          echo "ai-flow checker: $(shadowenv exec -- ai-flow version 2>/dev/null || echo 'not found') ($(shadowenv exec -- sh -c 'command -v ai-flow' 2>/dev/null || echo 'not on the project PATH'))"
          echo "ai-flow workflow yaml: ${{ github.job_workflow_sha || '(empty on this runner — see referenced_workflows on the run API)' }}"
          echo "pull request head: ${{ github.repository }}@$(git log -1 --format='%H')"

      - name: Origin-firing check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          AI_FLOW_APP_ID: ${{ secrets.AI_FLOW_APP_ID }}
          AI_FLOW_APP_PRIVATE_KEY: ${{ secrets.AI_FLOW_APP_PRIVATE_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          AI_FLOW_WORKDIR: ${{ github.workspace }}
          # App names are globally unique, so an adopter's App may not be
          # named ai-flow — derive the bot login from the actual slug, or the
          # origin-evidence bot filter misses this deployment's own panels.
          AI_FLOW_BOT_LOGIN: ${{ format('{0}[bot]', steps.app-token.outputs.app-slug || 'ai-flow') }}
        run: shadowenv exec -- ai-flow gate
