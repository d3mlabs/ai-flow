# ai-flow's own caller: this repo adopts the slash commands it provides.
# templates/caller-workflow.yml, under a different name because
# ai-commands.yml here is the reusable workflow itself. A /build on this
# repo edits a branch checkout; the dispatcher that runs it is a separate
# checkout of main (post plans#76, the deployed release), and the only
# output is a PR — nothing a job does changes what the next job runs.
# Workflow-file edits are never committed by the bot (Build lifts them
# out as a patch) and need a code-owner review to land.
name: ai-commands

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  # Review summaries: a command in the review's summary text dispatches too
  # (submitted only — edits and dismissals never re-fire a command).
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  ai-commands:
    # @main so the workflow YAML tracks the dispatcher code, which is also
    # checked out at main — a tag pin here silently splits the two versions.
    uses: d3mlabs/ai-flow/.github/workflows/ai-commands.yml@main
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      AI_FLOW_APP_ID: ${{ secrets.AI_FLOW_APP_ID }}
      AI_FLOW_APP_PRIVATE_KEY: ${{ secrets.AI_FLOW_APP_PRIVATE_KEY }}
