# CI runs what a developer runs: `dev up`, then the check verbs dev.yml
# defines — `dev style`, `dev typecheck`, `dev test`. Nothing here invokes
# the toolchain directly: dev provisions the locked Ruby and gems from
# dependencies.rb, and every dev command errors in CI when the manifest and
# the lock disagree, so a dependencies.rb edit without `dev deps update`
# fails the first step (ai-flow#176 — a stale lock reached main and halted
# every dispatcher because CI went through bundler and never ran dev).
#
# One job per verb, named as the branch protection's required checks; each
# pays its own `dev up` (a probe once the tap's bottles are cached, the
# cursor-cli cask the one real download). GH_TOKEN is the credential the
# action's toolchain check requires; the job's own token reaches every pin
# this public tap serves.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: d3mlabs/dev/up@main
      - run: dev style

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: d3mlabs/dev/up@main
      - run: dev typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: d3mlabs/dev/up@main
      - run: dev test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          # Upload only the cobertura report: auto-search also picks up
          # SimpleCov's native coverage.json, whose "ignored" line entries
          # (simplecov-sorbet's skipped ranges) error Codecov's processing.
          disable_search: true
          fail_ci_if_error: false
