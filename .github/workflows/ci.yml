name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No ruby-version input: setup-ruby reads .ruby-version, which dev
      # generates from dependencies.rb — the Gemfile pins that exact patch
      # version, so a floating "3.3" here would fail bundler's version check.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rubocop

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Verify gem RBIs are current
        run: bundle exec tapioca gem --verify
      - run: bundle exec srb tc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - run: bundle exec rake test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.xml
          # Upload only the cobertura report: auto-search also picks up
          # SimpleCov's native coverage.json, whose "ignored" line entries
          # (simplecov-sorbet's skipped ranges) error Codecov's processing.
          disable_search: true
          fail_ci_if_error: false
