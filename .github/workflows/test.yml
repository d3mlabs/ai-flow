name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No ruby-version input: setup-ruby reads .ruby-version, which dev
      # generates from dependencies.rb — the Gemfile pins that exact patch
      # version, so a floating "3.3" here would fail bundler's version check.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Verify gem RBIs are current
        run: bundle exec tapioca gem --verify
      - name: Typecheck
        run: bundle exec srb tc
      - run: bundle exec rake test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.json
          fail_ci_if_error: false
