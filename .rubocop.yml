inherit_gem:
  rubocop-shopify: rubocop.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-sorbet

AllCops:
  SuggestExtensions: false
  Exclude:
    # Generated by dev from dependencies.rb — lint the manifest, not the artifact.
    - Gemfile

# Tests are written in the RSpock dialect: bare comparisons in Then/Expect
# blocks and block-name constants (Given/When/Then/Where/Cleanup) are
# rewritten into assertions by the AST transform, not evaluated for value.
Lint/Void:
  Exclude:
    - test/**/*_test.rb

# RSpock Where-table rows chain cells with |, so twin columns read as
# identical operands; the value-semantics assertions also compare an object
# to itself on purpose (reflexivity is part of the == contract).
Lint/BinaryOperatorWithIdenticalOperands:
  Exclude:
    - test/**/*
