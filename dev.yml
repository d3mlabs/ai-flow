name: ai-flow
# ai-flow is its own deployment (plans#76): `dev release <version>` cuts an
# immutable GitHub release carrying the tree below, `dev deploy gh` moves
# the series tag `v<major>` (and the latest designation) to it, and every
# adopter reads that head twice — its caller workflow's `uses: …@v1` and
# its lock's `gh "d3mlabs/ai-flow", "^1"`, re-locked with `dev deps
# update`. `dev up` needs no entry here: the builtin installs the locked
# toolchain and gems from dependencies.rb.
targets:
  ai-flow:
    desc: The deployed tool (exe, lib, templates, VERSION, the manifest and its locks)
    # The checkout is the stage. The manifest and both locks ship, which
    # is what makes the installed tree self-contained: dev converges them
    # into it and writes bin/ — never ours to ship. Listed positively so a
    # new top-level directory is a deliberate addition to the asset, not a
    # silent ship. Anchored (gitignore syntax): a bare `exe` would also
    # take test/exe.
    packager:
      archive:
        files:
          - /exe
          - /lib
          - /templates
          - /VERSION
          - /Gemfile
          - /Gemfile.lock
          - /dependencies.rb
          - /deps.lock
# The three check verbs CI runs, in this order, after `dev up`; the same
# three a developer runs. CI runs nothing but these, so a check exists
# exactly when a verb defines it. The job entry points are not commands
# here: the reusable workflows run `ai-flow dispatch` and `ai-flow gate`
# from the project PATH — the adopter's installed tree, or this checkout's
# exe/ when the checkout is ai-flow.
commands:
  style:
    desc: Run RuboCop
    run: bundle exec rubocop
  typecheck:
    desc: Verify the gem RBIs are current, then Sorbet static typecheck
    run: bundle exec tapioca gem --verify && bundle exec srb tc
  test:
    desc: Run this repo's tests
    run: bundle exec rake test
  deploy:
    commands:
      gh:
        desc: Move the series tag and the latest designation to a release
        targets: [ai-flow]
  release:
    desc: Cut a release (tag, push, ai-flow-<version>.zip on the GitHub release)
    targets: [ai-flow]
# The runner shape of an ai-flow host, declared where the shape is known
# (`dev runner register --org --role <name>` from this checkout). Both
# roles join a group pinned to this repo's two reusable workflows at the
# series tag of VERSION. A host records no version of ai-flow: the
# dispatcher a job runs is the adopter's lock's, installed by the job's
# own `dev up`.
runner_roles:
  # The agent slots: one label per command route, jobs as the ai-agent
  # identity (user, data-root group, the one-way sudoers edge from the
  # runner user), in a group whose selected repos are each adopter's
  # admission.
  agent:
    labels: [ai-ask, ai-edit, ai-split, ai-build, ai-learn]
    group: ai-flow
    workflows: [.github/workflows/ai-commands.yml, .github/workflows/origin-firing.yml]
    job_identity: ai-agent
  # The orchestrator pool `/build --split` runs on: a thin pool open to
  # every repo in the org, since any adopter's split must reach it.
  orchestrator:
    labels: [ai-orchestrator]
    group: { name: ai-orchestrator, visibility: all }
    workflows: [.github/workflows/ai-commands.yml, .github/workflows/origin-firing.yml]
