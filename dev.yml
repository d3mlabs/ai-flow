name: ai-flow
# `dev up` needs no entry here: the builtin installs the locked toolchain and
# gems from dependencies.rb. Runners use `dev install-deps` (headless — no
# shell hooks, no credential prompts) before `dev dispatch`.
commands:
  test:
    desc: Run this repo's tests
    run: bundle exec rake test
  typecheck:
    desc: Sorbet static typecheck
    run: bundle exec srb tc
  dispatch:
    desc: Run the slash-command dispatcher (the ai-commands workflow entry point)
    run: bundle exec ruby bin/dispatch.rb
  origin-firing-check:
    desc: Run the origin-firing proposal check (the origin-firing workflow entry point)
    run: bundle exec ruby bin/origin_firing_check.rb
